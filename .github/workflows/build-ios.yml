name: Build iOS (unsigned ipa)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project FlacMusic.xcodeproj \
            -scheme FlacMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FlacMusic.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Pack unsigned ipa
        run: |
          mkdir -p Payload
          cp -R build/FlacMusic.xcarchive/Products/Applications/FlacMusic.app Payload/
          zip -qry FlacMusic-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlacMusic-unsigned-ipa
          path: FlacMusic-unsigned.ipa
