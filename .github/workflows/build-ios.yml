name: Build iOS (unsigned ipa)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          echo "---- schemes ----"
          xcodebuild -project FlacMusic.xcodeproj -list || true

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project FlacMusic.xcodeproj \
            -scheme FlacMusic \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/FlacMusic.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee archive.log | tail -30

      - name: Report error summary (public annotations)
        if: failure()
        run: |
          emit() { while IFS= read -r line; do echo "::error::${line:0:280}"; done; }
          if [ -f archive.log ]; then
            grep -E "error:|Reason:" archive.log | sort -u | head -4 | emit
          fi
          plutil -lint FlacMusic.xcodeproj/project.pbxproj 2>&1 | head -1 | emit
          echo "DIR: $(ls FlacMusic.xcodeproj 2>&1 | tr '\n' ' ' | cut -c1-250)" | emit
          head -3 FlacMusic.xcodeproj/project.pbxproj 2>&1 | emit
          xcodebuild -project FlacMusic.xcodeproj -list 2>&1 | head -2 | emit

      - name: Pack unsigned ipa
        if: success()
        run: |
          mkdir -p Payload
          cp -R build/FlacMusic.xcarchive/Products/Applications/FlacMusic.app Payload/
          zip -qry FlacMusic-unsigned.ipa Payload

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: FlacMusic-unsigned-ipa
          path: FlacMusic-unsigned.ipa
